{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>VoteSmart - Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light text-center p-5">

    <h1 class="mb-4">Welcome to VoteSmart</h1>
    <p class="mb-5">Empowering Voters, One Click at a Time</p>

    <!-- Buttons -->
    <button class="btn btn-primary me-3" data-bs-toggle="modal" data-bs-target="#signupModal">Sign Up</button>
    <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#loginModal">Log In</button>

    <!-- Sign Up Modal -->
    <div class="modal fade" id="signupModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Sign Up</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form method="POST" action="{% url 'signup' %}">
              {% csrf_token %}
              {{ signup_form.as_p }}
              <button type="submit" class="btn btn-primary">Register</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Log In</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form method="POST" action="{% url 'login' %}">
              {% csrf_token %}
              {{ login_form.as_p }}
              <button type="submit" class="btn btn-secondary">Log In</button>
            </form>
          </div>
        </div>
      </div>
    </div>

</body>
</html>
